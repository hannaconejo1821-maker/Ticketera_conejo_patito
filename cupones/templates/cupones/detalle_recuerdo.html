{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ recuerdo.titulo }} 💜</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cupones/css/styles.css' %}">
</head>

<body>

    <div class="diary-page">
        <div class="diary-container">

            <div class="diary-header">
                <span class="cloud-icon">✨</span>
                <h1>{{ recuerdo.titulo }}</h1>
                <p class="subtitle">{{ recuerdo.fecha }} 🌸</p>
            </div>

            {% if recuerdo.imagen %}
            <div
                style="width: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(123, 31, 162, 0.15);">
                <img src="{{ recuerdo.imagen.url }}" style="width: 100%; display: block; object-fit: cover;">
            </div>
            {% endif %}

            <p style="margin-top: 15px; font-size: 1.05rem; line-height: 1.6; color: #4A148C; text-align: justify;">
                {{ recuerdo.descripcion }}
            </p>

            <a href="{% url 'lista_recuerdos' %}" class="back-link" style="margin-top: 10px;">
                ← Volver a las nubes ☁️
            </a>

        </div>
    </div>

</body>

</html>
